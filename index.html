  <body>
    <div id="splash" aria-label="Caricamento Milano City Championship">
      <img src="/brand/mcc-logo-240.webp" alt="" width="148" height="181" />
    </div>
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 45%, #ffffff 0%, #eef2f8 70%, #dfe6f1 100%); transition: opacity .45s ease, visibility .45s; }
      #splash img { width: 148px; height: auto; animation: mcc-beat 1.15s ease-in-out infinite; filter: drop-shadow(0 10px 24px rgba(2, 32, 72, .28)); }
      #splash.hide { opacity: 0; visibility: hidden; }
      @keyframes mcc-beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.12); } 28% { transform: scale(1); } 42% { transform: scale(1.08); } 70% { transform: scale(1); } }
      @media (prefers-color-scheme: dark) { #splash { background: radial-gradient(60% 50% at 50% 45%, #0d2f5f 0%, #041a38 70%, #020f22 100%); } #splash img { filter: drop-shadow(0 0 28px rgba(255, 255, 255, .25)); } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
    <script>
      // la schermata di avvio con il logo compare solo al primo caricamento della sessione
      try { if (sessionStorage.getItem('mcc-splash')) document.getElementById('splash').remove(); else sessionStorage.setItem('mcc-splash', '1'); } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
